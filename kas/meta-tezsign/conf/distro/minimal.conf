DISTRO = "minimal"
DISTRO_NAME = "TezSign - built with love for the Tezos community by tez.capital"
DISTRO_VERSION = "1.0"

# 1. Enable systemd and usrmerge, remove sysvinit
DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES:remove = "sysvinit"
DISTRO_FEATURES_OPTED_OUT = "sysvinit"

# 2. Set systemd as the primary init manager
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
VIRTUAL-RUNTIME_login_manager = "shadow-base"

VIRTUAL-RUNTIME_base-utils = "toybox"
PREFERRED_PROVIDER_virtual/base-utils = "toybox"

USER_OVERRIDES += "${@'tezdev:' if d.getVar('TEZSIGN_DEV') == '1' else ''}"

PREFERRED_PROVIDER_virtual/sh = ""
PREFERRED_PROVIDER_virtual/sh:tezdev = "dash"

ALTERNATIVE_PRIORITY:pn-toybox = "${@bb.utils.contains('TEZSIGN_DEV', '1', '60', '100', d)}"
NO_RECOMMENDATIONS = "1"
BAD_RECOMMENDATIONS += "busybox busybox-syslog busybox-udhcpc"
# systemd RRECOMMENDS systemd-mime, which hard-RDEPENDS shared-mime-info-data
# and drags in shared-mime-info -> glib-2.0 -> libxml2. A MIME database has no
# place on a signing appliance; pin the exclusion (belt-and-suspenders over
# NO_RECOMMENDATIONS).
BAD_RECOMMENDATIONS += "systemd-mime"
PACKAGE_EXCLUDE = "busybox"

# Production images stay headless; dev images keep the local console stack.
BAD_RECOMMENDATIONS += "${@bb.utils.contains('TEZSIGN_DEV', '1', '', ' systemd-extra-utils udev-hwdb openssl-ossl-module-legacy', d)}"
PACKAGECONFIG:remove:pn-systemd = "${@bb.utils.contains('TEZSIGN_DEV', '1', '', ' vconsole networkd resolved timesyncd timedated logind hostnamed machined userdb nss-mymachines nss-resolve pni-names sysvinit quotacheck binfmt', d)}"
PACKAGECONFIG:append:pn-systemd = "${@bb.utils.contains('TEZSIGN_DEV', '1', '', ' serial-getty-generator', d)}"
PACKAGECONFIG:remove:pn-dbus = "${@bb.utils.contains('TEZSIGN_DEV', '1', '', ' x11 user-session', d)}"

# kmod links OpenSSL (libcrypto, ~5.5 MiB) only for kernel-module signature
# verification. This appliance runs a monolithic, module-less kernel, so drop it
# — it is the single largest file in the rootfs and nothing else needs libcrypto.
PACKAGECONFIG:remove:pn-kmod = "openssl"

IMAGE_LINGUAS = ""
USE_VT = "${@bb.utils.contains('TEZSIGN_DEV', '1', '1', '0', d)}"
TCLIBC = "musl"
