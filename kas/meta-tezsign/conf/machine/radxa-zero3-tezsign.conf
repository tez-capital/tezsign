# Disable meta-rockchip's fitImage path: we boot a raw Image + DTB via extlinux
# (see prepare_rockchip_bootfs), not a fitImage. This must be set BEFORE the
# include below, because rockchip-defaults.inc does `RK_KERNEL_FITIMAGE ?= "True"`
# and then conditionally requires rockchip-fitimage.inc (which would build the
# separate linux-yocto-fitimage recipe and pull kernel-fit-extra-artifacts).
RK_KERNEL_FITIMAGE = "False"

# Default the generic Radxa Zero 3 target to the 3W machine.
include conf/machine/radxa-zero-3w.conf

PREFERRED_PROVIDER_virtual/kernel = "linux-mainline"
PREFERRED_VERSION_linux-mainline ?= "6.18+git"

# Use a raw Image + separate DTB instead of fitImage.
# This matches how Armbian boots Rockchip boards and is the most reliable path.
#
# Keep the kernel and bundled initramfs RAW (uncompressed): the rootfs is embedded
# uncompressed and the kernel is a plain Image. The release pipeline xz-compresses
# the whole .img in a single strong pass (~10.6 MiB), which beats compressing the
# initramfs with the kernel's weak built-in xz and/or wrapping it as Image.gz
# (those produce already-compressed bytes the release xz cannot shrink further).
# This relies on the rootfs staying small enough that raw Image fits the 64 MiB
# /boot partition (see BAD_RECOMMENDATIONS in distro/minimal.conf).
KERNEL_IMAGETYPES = "Image"
KERNEL_IMAGETYPE = "Image"
KERNEL_CLASSES = ""

# Override meta-rockchip's default root= for initramfs boot (rootfs lives in RAM).
UBOOT_EXTLINUX_ROOT = "root=/dev/ram0"

# Boot partition contents: kernel Image (with bundled initramfs) + DTB.
# IMAGE_BOOT_FILES = " \
#     ${KERNEL_IMAGETYPE} \
#     ${@d.getVar('KERNEL_DEVICETREE').replace('rockchip/', '')} \
# "

# Keep production images aligned with the Pi policy: do not drag the full
# kernel module bundle into the image by machine recommendation.
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-modules"

